name: Release Obsidian theme

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.5

      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build

  release:
    needs: verify
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      # check:css verified these committed files against a fresh in-memory build.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! version="$(jq -er '.version | strings' manifest.json)" || [ -z "$version" ]; then
            echo "::error::manifest.json must contain a non-empty string version."
            exit 1
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::manifest.json version must be X.Y.Z (got '$version')."
            exit 1
          fi
          if output="$(gh release view "$version" --json isDraft -q .isDraft 2>&1)"; then
            case "$output" in
              false) echo "Release $version already exists, skipping"; exit 0 ;;
              true) echo "::error::Release $version exists as a draft; publish or delete it."; exit 1 ;;
              *) echo "::error::Unexpected release lookup result: $output"; exit 1 ;;
            esac
          elif [ "$output" != "release not found" ]; then
            echo "::error::Release lookup failed: $output"
            exit 1
          fi
          gh release create "$version" --target "$GITHUB_SHA" --title "$version" --generate-notes manifest.json theme.css
