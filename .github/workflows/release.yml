name: Release Obsidian theme

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! version="$(jq -er '.version | strings' manifest.json)" || [ -z "$version" ]; then
            echo "::error::manifest.json must contain a non-empty string version."
            exit 1
          fi
          if [[ "$version" == v* ]]; then
            echo "::error::manifest.json version must not start with v."
            exit 1
          fi
          if output="$(gh release view "$version" 2>&1)"; then
            echo "Release $version already exists, skipping"
            exit 0
          elif [ "$output" != "release not found" ]; then
            echo "::error::Release lookup failed: $output"
            exit 1
          fi
          gh release create "$version" --target "$GITHUB_SHA" --title "$version" --generate-notes manifest.json theme.css
