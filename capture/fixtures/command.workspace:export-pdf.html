<!doctype html>
<html lang="en" style="font-size: calc(16px * var(--preferred-text-scale, 1));" dir="ltr">
<head><meta charset="utf-8"></head>

<div class="modal-container mod-confirmation mod-dim" data-capture-target=""><div class="modal-bg" style="opacity: 0.85;"></div><div class="modal mod-narrow"><div class="modal-header-button mod-raised clickable-icon"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="svg-icon lucide-x"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></div><div class="modal-header"><div class="modal-title">Export to PDF</div></div><div class="modal-content"><p class="u-muted u-break-word">Export “Kitchen sink” to PDF with the settings below.</p><div class="setting-item mod-toggle" tabindex="-1"><div class="setting-item-info"><div class="setting-item-name">Include file name as title</div><div class="setting-item-description"></div></div><div class="setting-item-control"><label class="checkbox-container" tabindex="0"><input type="checkbox" tabindex="-1"></label></div></div><div class="setting-item" tabindex="-1"><div class="setting-item-info"><div class="setting-item-name">Page size</div><div class="setting-item-description"></div></div><div class="setting-item-control"><select class="dropdown" style="--dropdown-fitted-width: 76px;"><option value="A3">A3</option><option value="A4">A4</option><option value="A5">A5</option><option value="Legal">Legal</option><option value="Letter" selected="">Letter</option><option value="Tabloid">Tabloid</option></select><select class="dropdown is-measuring" aria-hidden="true" tabindex="-1"><option selected="">Letter</option></select></div></div><div class="setting-item mod-toggle" tabindex="-1"><div class="setting-item-info"><div class="setting-item-name">Landscape</div><div class="setting-item-description"></div></div><div class="setting-item-control"><label class="checkbox-container" tabindex="0"><input type="checkbox" tabindex="-1"></label></div></div><div class="setting-item" tabindex="-1"><div class="setting-item-info"><div class="setting-item-name">Margin</div><div class="setting-item-description"></div></div><div class="setting-item-control"><select class="dropdown" style="--dropdown-fitted-width: 84px;"><option value="0" selected="">Default</option><option value="2">Minimal</option><option value="1">None</option></select><select class="dropdown is-measuring" aria-hidden="true" tabindex="-1"><option selected="">Default</option></select></div></div><div class="setting-item" tabindex="-1"><div class="setting-item-info"><div class="setting-item-name">Downscale percent</div><div class="setting-item-description"></div></div><div class="setting-item-control"><span class="slider-value">100</span><input class="slider" type="range" data-ignore-swipe="true" min="10" max="100" step="1" style="--slider-fill-ratio: 1;" value="100"></div></div></div><div class="modal-button-container"><button class="mod-cta">Export to PDF</button><button class="mod-cancel">Cancel</button></div></div></div>
</body>
