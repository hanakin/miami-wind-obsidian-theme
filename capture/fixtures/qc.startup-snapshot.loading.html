(function () {
	var started = false;
	// Whether the snapshot may still arrive
	var pending = false;
	var waiting = false;
	var waitStart = 0;
	var frame = null;

	function start() {
		if (started) return;
		started = true;
		performance.measure('startup-snapshot-wait', { start: waitStart || performance.now() });
		var script = document.createElement('script');
		script.src = 'app.js';
		document.body.appendChild(script);

		requestAnimationFrame(function () {
			setTimeout(start, 0);
		});

		pending = false;
		// The app removes the snapshot, so it can't be added once the app has started

			if (waiting) start();
			return;
		}

		frame.id = 'startup-snapshot';
		// No scripts run in it

				els[j].scrollLeft = Number(scroll[1]);

		function moveFocus(back) {
